project.description = 'Abstract JDBC plugin for Kestra'

dependencies {
    api "com.zaxxer:HikariCP:7.1.0"

    // Test-scoped investigation artifact only (see JooqSqlSplitter/JdbcStatementSplitter): jOOQ was
    // evaluated as a SqlSplitter replacement and found unsafe (issue #782), so it never ships in the
    // production jar. io.kestra:platform already constrains org.jooq:jooq to 3.19.18 via the
    // micronaut-sql-bom (as a version constraint only, nothing pulls in an actual jOOQ artifact from
    // it today) — this pins the test-only usage above that constraint.
    testImplementation "org.jooq:jooq:3.21.7"
}

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "Abstract JDBC",
                "X-Kestra-Group": project.group + ".jdbc",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

configurations {
    testOutput
}

task testJar(type: Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

artifacts {
    testOutput testJar
}
