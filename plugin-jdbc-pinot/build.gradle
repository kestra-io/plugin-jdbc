project.description = 'Connect and query Apache Pinot databases using Kestra\'s JDBC plugin.'

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "Apache Pinot",
                "X-Kestra-Group": project.group + ".jdbc.pinot",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

dependencies {
    implementation("org.apache.pinot:pinot-jdbc-client:1.6.0") {
        exclude group: 'org.slf4j'
        exclude group: 'com.fasterxml.jackson.core'
        // pinot-spi 1.6.0 pulls the POM-only groovy-all aggregator, which breaks shadowJar; the JDBC client does not use Groovy
        exclude group: 'org.codehaus.groovy', module: 'groovy-all'
    }
    implementation project(':plugin-jdbc')

    constraints {
        implementation('org.asynchttpclient:async-http-client:3.0.14') {
            because 'Pinot 1.6.0 brings 3.0.13, which is vulnerable to CVE-2026-107226, CVE-2026-107227, CVE-2026-107228 and CVE-2026-107230'
        }
    }

    testImplementation project(path: ':plugin-jdbc', configuration: 'testOutput')
    testRuntimeOnly project(path: ':plugin-jdbc', configuration: 'shadow')
}

shadowJar {
    archiveClassifier.set(null)
    mergeServiceFiles()
    minimize ()
}