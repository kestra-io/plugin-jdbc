id: all_sybase
namespace: test.plugin-jdbc

variables:
  sybase_user: sa
  sybase_password: myPassword
  sybase_db: master

tasks:
  - id: port
    type: io.kestra.plugin.core.debug.Return
    format: "{{ randomPort() }}"

  - id: dockerStart
    type: io.kestra.plugin.docker.Run
    containerImage: datagrip/sybase:16.0
    portBindings:
      - "{{ outputs.port.value }}:5000"
    wait: false

  # Poll for readiness with a loop rather than a task-level `retry`: a retry makes the executor
  # duplicate the task run, which can silently drop a downstream task (see kestra-io/kestra#18909).
  # The probe is `allowFailure` so a refused connection just ends the iteration; the loop exits
  # once the probe returned a row, and fails loudly if the container never becomes reachable.
  - id: wait_for_sybase
    type: io.kestra.plugin.core.flow.LoopUntil
    condition: "{{ (outputs.sybase_ping ?? {}).row is defined }}"
    failOnMaxReached: true
    checkFrequency:
      interval: PT10S
      maxDuration: PT900S
    tasks:
      - id: sybase_ping
        type: io.kestra.plugin.jdbc.sybase.Query
        username: "{{ vars.sybase_user }}"
        password: "{{ vars.sybase_password }}"
        url: "jdbc:sybase:Tds:localhost:{{ outputs.port.value }}/{{ vars.sybase_db }}"
        sql: "SELECT 1"
        fetchType: FETCH_ONE
        allowFailure: true

  - id: query
    type: io.kestra.plugin.jdbc.sybase.Query
    username: "{{ vars.sybase_user }}"
    password: "{{ vars.sybase_password }}"
    url: "jdbc:sybase:Tds:localhost:{{ outputs.port.value }}/{{ vars.sybase_db }}"
    fetchType: FETCH
    sql: |
      SELECT TOP 3
        name,
        type
      FROM sysobjects
      ORDER BY name

  - id: queries
    type: io.kestra.plugin.jdbc.sybase.Queries
    username: "{{ vars.sybase_user }}"
    password: "{{ vars.sybase_password }}"
    url: "jdbc:sybase:Tds:localhost:{{ outputs.port.value }}/{{ vars.sybase_db }}"
    fetchType: STORE
    sql: |
      SELECT TOP 3 name, type FROM sysobjects ORDER BY name;
      SELECT TOP 1 name, type FROM sysobjects ORDER BY name;

  - id: assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.query.rows[0].name is not empty }}"
      - "{{ outputs.queries.outputs[0].size == 3 }}"
      - "{{ outputs.queries.outputs[1].size == 1 }}"

finally:
  - id: dockerStop
    type: io.kestra.plugin.docker.Stop
    containerId: "{{ outputs.dockerStart.taskRunner.containerId }}"
    kill: true

  - id: purge
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
