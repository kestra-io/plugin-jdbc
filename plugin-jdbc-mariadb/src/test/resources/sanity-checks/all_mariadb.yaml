id: all_mariadb
namespace: sanitychecks.plugin-jdbc

variables:
  mariadb_password: sanity
  mariadb_user: test
  mariadb_db: sanitychecks

tasks:
  - id: port
    type: io.kestra.plugin.core.debug.Return
    format: "{{ randomPort() }}"

  - id: dockerStart
    type: io.kestra.plugin.docker.Run
    containerImage: mariadb:11
    portBindings:
      - "{{ outputs.port.value }}:3306"
    wait: false
    env:
      MARIADB_ROOT_PASSWORD: "{{ vars.mariadb_password }}"
      MARIADB_DATABASE: "{{ vars.mariadb_db }}"
      MARIADB_USER: "{{ vars.mariadb_user }}"
      MARIADB_PASSWORD: "{{ vars.mariadb_password }}"

  # Poll for readiness with a loop rather than a task-level `retry`: a retry makes the executor
  # duplicate the task run, which can silently drop a downstream task (see kestra-io/kestra#18909).
  # The probe is `allowFailure` so a refused connection just ends the iteration; the loop exits
  # once the probe returned a row, and fails loudly if the container never becomes reachable.
  - id: wait_for_mariadb
    type: io.kestra.plugin.core.flow.LoopUntil
    condition: "{{ (outputs.mariadb_ping ?? {}).row is defined }}"
    failOnMaxReached: true
    checkFrequency:
      interval: PT5S
      maxDuration: PT300S
    tasks:
      - id: mariadb_ping
        type: io.kestra.plugin.jdbc.mariadb.Query
        username: "{{ vars.mariadb_user }}"
        password: "{{ vars.mariadb_password }}"
        url: "jdbc:mariadb://localhost:{{ outputs.port.value }}/{{ vars.mariadb_db }}"
        sql: SELECT 1
        fetchType: FETCH_ONE
        allowFailure: true

  - id: create_table
    type: io.kestra.plugin.jdbc.mariadb.Query
    username: "{{ vars.mariadb_user }}"
    password: "{{ vars.mariadb_password }}"
    url: "jdbc:mariadb://localhost:{{ outputs.port.value }}/{{ vars.mariadb_db }}"
    fetchType: NONE
    sql: |
      CREATE TABLE IF NOT EXISTS test(
        field1 INT,
        field2 INT
      );

  - id: insert_data
    type: io.kestra.plugin.jdbc.mariadb.Queries
    username: "{{ vars.mariadb_user }}"
    password: "{{ vars.mariadb_password }}"
    url: "jdbc:mariadb://localhost:{{ outputs.port.value }}/{{ vars.mariadb_db }}"
    fetchType: NONE
    sql: |
      INSERT INTO test(field1, field2) VALUES (1, 2);
      INSERT INTO test(field1, field2) VALUES (3, 4);
      INSERT INTO test(field1, field2) VALUES (4, 5);

  - id: query
    type: io.kestra.plugin.jdbc.mariadb.Query
    username: "{{ vars.mariadb_user }}"
    password: "{{ vars.mariadb_password }}"
    url: "jdbc:mariadb://localhost:{{ outputs.port.value }}/{{ vars.mariadb_db }}"
    fetchType: FETCH
    sql: SELECT * FROM test ORDER BY field1;

  - id: queries
    type: io.kestra.plugin.jdbc.mariadb.Queries
    username: "{{ vars.mariadb_user }}"
    password: "{{ vars.mariadb_password }}"
    url: "jdbc:mariadb://localhost:{{ outputs.port.value }}/{{ vars.mariadb_db }}"
    fetchType: STORE
    sql: |
      SELECT * FROM test ORDER BY field1;
      SELECT * FROM test ORDER BY field1 LIMIT 1;

  - id: select_and_store
    type: io.kestra.plugin.jdbc.mariadb.Query
    username: "{{ vars.mariadb_user }}"
    password: "{{ vars.mariadb_password }}"
    url: "jdbc:mariadb://localhost:{{ outputs.port.value }}/{{ vars.mariadb_db }}"
    fetchType: STORE
    sql: SELECT * FROM test ORDER BY field1 LIMIT 2;

  - id: assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.query.rows[0].field1 == 1 }}"
      - "{{ outputs.query.rows[1].field2 == 4 }}"
      - "{{ outputs.queries.outputs[0].size == 3 }}"
      - "{{ outputs.queries.outputs[1].size == 1 }}"
      - "{{ outputs.select_and_store.size == 2 }}"

finally:
  - id: dockerStop
    type: io.kestra.plugin.docker.Stop
    containerId: "{{ outputs.dockerStart.taskRunner.containerId }}"
    kill: true

  - id: purge
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
