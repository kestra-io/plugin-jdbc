project.description = 'Query a compatible database using the Kestra Apache Arrow Flight SQL JDBC plugin.'

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "Arrow Flight SQL",
                "X-Kestra-Group": project.group + ".jdbc.arrowflight",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

configurations.all {
    resolutionStrategy {
        // SEC-0160: flight-sql-jdbc-core -> oauth2-oidc-sdk pulls json-smart 2.5.1 (CVE-2024-57699), remove once oauth2-oidc-sdk brings json-smart >= 2.5.2
        force "net.minidev:json-smart:2.6.1"
    }
}

dependencies {
    implementation("org.apache.arrow:flight-sql-jdbc-core:19.0.0")
    implementation project(':plugin-jdbc')

    testImplementation project(path: ':plugin-jdbc', configuration: 'testOutput')
    testRuntimeOnly project(path: ':plugin-jdbc', configuration: 'shadow')
}
