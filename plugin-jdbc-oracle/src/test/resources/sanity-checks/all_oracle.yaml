id: all_oracle
namespace: test.plugin-jdbc

variables:
  oracle_password: password
  oracle_user: testuser
  oracle_user_password: password
  oracle_service: FREEPDB1

tasks:
  - id: port
    type: io.kestra.plugin.core.debug.Return
    format: "{{ randomPort() }}"

  - id: dockerStart
    type: io.kestra.plugin.docker.Run
    containerImage: gvenzl/oracle-free:latest
    portBindings:
      - "{{ outputs.port.value }}:1521"
    wait: false
    env:
      ORACLE_PASSWORD: "{{ vars.oracle_password }}"
      APP_USER: "{{ vars.oracle_user }}"
      APP_USER_PASSWORD: "{{ vars.oracle_user_password }}"
    volumes:
      - "oracle-test-data:/opt/oracle/oradata"

  # Poll for readiness with a loop rather than a task-level `retry`: a retry makes the executor
  # duplicate the task run, which can silently drop a downstream task (see kestra-io/kestra#18909).
  # The probe is `allowFailure` so a refused connection just ends the iteration; the loop exits
  # once the probe returned a row, and fails loudly if the container never becomes reachable.
  - id: wait_for_oracle
    type: io.kestra.plugin.core.flow.LoopUntil
    condition: "{{ (outputs.oracle_ping ?? {}).row is defined }}"
    failOnMaxReached: true
    checkFrequency:
      interval: PT10S
      maxDuration: PT1200S
    tasks:
      - id: oracle_ping
        type: io.kestra.plugin.jdbc.oracle.Query
        username: "{{ vars.oracle_user }}"
        password: "{{ vars.oracle_user_password }}"
        url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
        sql: SELECT 1 FROM dual
        fetchType: FETCH_ONE
        allowFailure: true

  - id: create_table
    type: io.kestra.plugin.jdbc.oracle.Query
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: NONE
    sql: |
      BEGIN
        EXECUTE IMMEDIATE 'CREATE TABLE test (field1 NUMBER, field2 NUMBER)';
      EXCEPTION
        WHEN OTHERS THEN
          IF SQLCODE != -955 THEN RAISE; END IF;
      END;

  - id: cleanup
    type: io.kestra.plugin.jdbc.oracle.Query
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: NONE
    sql: TRUNCATE TABLE test

  - id: insert_data
    type: io.kestra.plugin.jdbc.oracle.Queries
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: NONE
    sql: |
      INSERT INTO test(field1, field2) VALUES (1, 2);
      INSERT INTO test(field1, field2) VALUES (3, 4);
      INSERT INTO test(field1, field2) VALUES (4, 5);

  - id: query
    type: io.kestra.plugin.jdbc.oracle.Query
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: FETCH
    sql: SELECT * FROM test ORDER BY field1

  - id: queries
    type: io.kestra.plugin.jdbc.oracle.Queries
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: STORE
    sql: |
      SELECT * FROM test ORDER BY field1;
      SELECT * FROM test ORDER BY field1 FETCH FIRST 1 ROWS ONLY;

  - id: select_and_store
    type: io.kestra.plugin.jdbc.oracle.Query
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: STORE
    sql: SELECT * FROM test ORDER BY field1 FETCH FIRST 2 ROWS ONLY

  # Exercises the multi-statement splitter (SqlSplitter, see kestra-io/plugin-jdbc#782) on a script
  # mixing DDL (as PL/SQL anonymous blocks, Oracle's only way to run DDL conditionally) and DML.
  - id: multi_statement
    type: io.kestra.plugin.jdbc.oracle.Queries
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: NONE
    sql: |
      BEGIN
        EXECUTE IMMEDIATE 'DROP TABLE multi_test';
      EXCEPTION
        WHEN OTHERS THEN
          IF SQLCODE != -942 THEN RAISE; END IF;
      END;
      BEGIN
        EXECUTE IMMEDIATE 'CREATE TABLE multi_test (field1 NUMBER, field2 NUMBER)';
      END;
      INSERT INTO multi_test(field1, field2) VALUES (1, 2);
      INSERT INTO multi_test(field1, field2) VALUES (3, 4);

  # Anonymous PL/SQL block containing several DML statements and internal semicolons, followed by
  # a plain SELECT: the block must be kept as a single statement, not split on its inner semicolons.
  - id: plsql_block
    type: io.kestra.plugin.jdbc.oracle.Queries
    username: "{{ vars.oracle_user }}"
    password: "{{ vars.oracle_user_password }}"
    url: "jdbc:oracle:thin:@//localhost:{{ outputs.port.value }}/{{ vars.oracle_service }}"
    fetchType: FETCH
    sql: |
      BEGIN
        INSERT INTO multi_test(field1, field2) VALUES (5, 6);
        INSERT INTO multi_test(field1, field2) VALUES (7, 8);
      END;
      SELECT COUNT(*) AS CNT FROM multi_test;

  - id: assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - '{{ outputs.query["rows"]["0"]["FIELD1"] == 1 }}'
      - '{{ outputs.query["rows"]["1"]["FIELD2"] == 4 }}'
      - '{{ outputs.queries["outputs"]["0"]["size"] == 3 }}'
      - '{{ outputs.queries["outputs"]["1"]["size"] == 1 }}'
      - "{{ outputs.select_and_store.size == 2 }}"
      - '{{ outputs.plsql_block["outputs"]["0"]["row"]["CNT"] == 6 }}'

finally:
  - id: dockerStop
    type: io.kestra.plugin.docker.Stop
    containerId: "{{ outputs.dockerStart.taskRunner.containerId }}"
    kill: true

  - id: purge
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
