project.description = 'Manage data in DuckDB with Kestra\'s JDBC plugin.'

// DuckDB only loads an extension built for its own version, so the bundled one follows the resolved driver (1.5.6.0 -> v1.5.6).
def duckdbCommunityExtensionVersion = providers.provider {
    def driver = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
        .collect { it.moduleVersion }
        .find { it != null && it.group == "org.duckdb" && it.name == "duckdb_jdbc" }
    if (driver == null) {
        throw new GradleException("Cannot bundle DuckDB community extensions: org.duckdb:duckdb_jdbc is not on the runtime classpath.")
    }
    "v${driver.version.tokenize(".").take(3).join(".")}"
}
// SHA-256 of the canonical PEM block (LF-separated keys, including the final LF).
def duckdbCommunityPublicKeyDigests = [
    'v2.0.0': '3990bfe47373e2313cb73af869d12d16107d3b634d7994a607847982028f1ac6'
]
def duckdbCommunityPublicKeysFile = layout.projectDirectory.file("src/main/resources/duckdb-community-public-keys.pem")
def bundledDuckDbExtensionsDir = layout.buildDirectory.dir("generated/duckdb-community-extensions")
def bundledDuckDbExtensions = [
    ion: ["linux_amd64", "linux_arm64"]
]
def bundledDuckDbExtensionsMetadataFile = bundledDuckDbExtensionsDir.map { it.file("duckdb-community-extensions.properties") }

tasks.register("bundleDuckDbCommunityExtensions") {
    inputs.property("duckdbVersion", duckdbCommunityExtensionVersion)
    inputs.property("communityPublicKeyDigests", duckdbCommunityPublicKeyDigests)
    inputs.file(duckdbCommunityPublicKeysFile)
    outputs.dir(bundledDuckDbExtensionsDir)

    doLast {
        def duckdbVersion = duckdbCommunityExtensionVersion.get()
        // Start clean so interrupted extension downloads are never reused.
        project.delete(bundledDuckDbExtensionsDir)

        def metadataFile = bundledDuckDbExtensionsMetadataFile.get().asFile
        metadataFile.parentFile.mkdirs()

        // Pin the community trust anchors for this engine release.
        def expectedKeyDigest = duckdbCommunityPublicKeyDigests[duckdbVersion]
        if (expectedKeyDigest == null) {
            throw new GradleException("No pinned community public key digest for DuckDB ${duckdbVersion}")
        }
        def keys = (duckdbCommunityPublicKeysFile.asFile.getText("UTF-8") =~ /(?s)-----BEGIN PUBLIC KEY-----.*?-----END PUBLIC KEY-----/)
            .collect { it.replace("\r\n", "\n") }
        if (keys.isEmpty()) {
            throw new GradleException("No DuckDB community public keys found in ${duckdbCommunityPublicKeysFile.asFile}")
        }
        def keyBlock = keys.join("\n") + "\n"
        def keyDigest = java.security.MessageDigest.getInstance("SHA-256")
            .digest(keyBlock.getBytes("UTF-8")).encodeHex().toString()
        if (keyDigest != expectedKeyDigest) {
            throw new GradleException("DuckDB ${duckdbVersion} community public key digest mismatch: expected ${expectedKeyDigest}, got ${keyDigest}")
        }
        // Reject malformed trust anchors before packaging.
        keys.each { pem ->
            def encoded = pem.replace("-----BEGIN PUBLIC KEY-----", "")
                .replace("-----END PUBLIC KEY-----", "").replaceAll(/\s/, "")
            java.security.KeyFactory.getInstance("RSA").generatePublic(
                new java.security.spec.X509EncodedKeySpec(Base64.decoder.decode(encoded))
            )
        }

        def properties = new Properties()
        properties.setProperty("duckdb.version", duckdbVersion)
        properties.setProperty("community.keys.count", keys.size().toString())
        properties.setProperty("bundled.extensions", bundledDuckDbExtensions.keySet().join(","))
        bundledDuckDbExtensions.each { extensionName, platforms ->
            properties.setProperty("bundled.extensions.${extensionName}", platforms.join(","))
        }
        metadataFile.withOutputStream { output ->
            properties.store(output, "Generated DuckDB community extension metadata")
        }

        bundledDuckDbExtensions.each { extensionName, platforms ->
            platforms.each { platform ->
                def outputDir = bundledDuckDbExtensionsDir.get().file("duckdb-community-extensions/${duckdbVersion}/${platform}").asFile
                def outputFile = new File(outputDir, "${extensionName}.duckdb_extension")

                outputDir.mkdirs()

                def gzUrl = new URL("https://community-extensions.duckdb.org/${duckdbVersion}/${platform}/${extensionName}.duckdb_extension.gz")
                def gzFile = new File(outputDir, "${extensionName}.duckdb_extension.gz")

                try {
                    gzUrl.withInputStream { input ->
                        gzFile.withOutputStream { output -> output << input }
                    }
                } catch (IOException e) {
                    gzFile.delete()
                    throw new GradleException("Cannot download the DuckDB community extension '${extensionName}' ${duckdbVersion} for ${platform} from ${gzUrl}. It may not be published yet for this DuckDB release.", e)
                }

                new java.util.zip.GZIPInputStream(new FileInputStream(gzFile)).withCloseable { input ->
                    outputFile.withOutputStream { output -> output << input }
                }

                gzFile.delete()
            }
        }
    }
}

processResources {
    dependsOn(tasks.named("bundleDuckDbCommunityExtensions"))
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
    dependsOn(tasks.named("bundleDuckDbCommunityExtensions"))
}

sourceSets {
    main {
        resources {
            srcDir(bundledDuckDbExtensionsDir)
        }
    }
}

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "DuckDB",
                "X-Kestra-Group": project.group + ".jdbc.duckdb",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

dependencies {
    implementation("org.duckdb:duckdb_jdbc:2.0.0.1")
    implementation project(':plugin-jdbc')

    testImplementation project(path: ':plugin-jdbc', configuration: 'testOutput')
    testRuntimeOnly project(path: ':plugin-jdbc', configuration: 'shadow')
    testImplementation "ch.qos.logback:logback-classic"
}
