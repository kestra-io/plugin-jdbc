project.description = 'Connect to Redshift databases using Kestra\'s JDBC plugin.'

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "Amazon Redshift",
                "X-Kestra-Group": project.group + ".jdbc.redshift",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

configurations.configureEach {
    // The driver builds no async AWS client, so the Netty one is dead weight
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
}

dependencies {
    jdbcDriver 'com.amazon.redshift:redshift-jdbc42:2.2.9'
    // The driver declares these optional, its IAM authentication needs them at runtime
    implementation 'software.amazon.awssdk:redshift'
    implementation 'software.amazon.awssdk:redshiftserverless'
    implementation 'software.amazon.awssdk:sts'
    implementation 'software.amazon.awssdk:apache-client'
    implementation project(':plugin-jdbc')

    testImplementation project(path: ':plugin-jdbc', configuration: 'testOutput')
    testRuntimeOnly project(path: ':plugin-jdbc', configuration: 'shadow')
}

test {
    systemProperty "user.timezone", "UTC"
}

