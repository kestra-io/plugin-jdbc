[databases]
* = host=redshift-pg port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
ignore_startup_parameters = driver_version,os_version,client_protocol_version,driver_discovery_version,extra_float_digits,client_encoding
admin_users = kestra
