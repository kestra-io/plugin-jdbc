id: all_trino
namespace: sanitychecks.plugin-jdbc

variables:
  trino_user: kestra

tasks:
  - id: port
    type: io.kestra.plugin.core.debug.Return
    format: "{{ randomPort() }}"

  - id: dockerStart
    type: io.kestra.plugin.docker.Run
    containerImage: trinodb/trino:latest
    portBindings:
      - "{{ outputs.port.value }}:8080"
    wait: false

  # Poll for readiness with a loop rather than a task-level `retry`: a retry makes the executor
  # duplicate the task run, which can silently drop a downstream task (see kestra-io/kestra).
  # The probe is `allowFailure` so a refused connection just ends the iteration; the loop exits
  # once the probe returned a row, and fails loudly if the container never becomes reachable.
  - id: wait_for_trino
    type: io.kestra.plugin.core.flow.LoopUntil
    condition: "{{ (outputs.trino_ping ?? {}).row is defined }}"
    failOnMaxReached: true
    checkFrequency:
      interval: PT5S
      maxDuration: PT300S
    tasks:
      - id: trino_ping
        type: io.kestra.plugin.jdbc.trino.Query
        username: "{{ vars.trino_user }}"
        url: "jdbc:trino://localhost:{{ outputs.port.value }}"
        sql: "SELECT 1"
        fetchType: FETCH_ONE
        allowFailure: true

  - id: create_table
    type: io.kestra.plugin.jdbc.trino.Query
    username: "{{ vars.trino_user }}"
    url: "jdbc:trino://localhost:{{ outputs.port.value }}"
    fetchType: NONE
    sql: |
      CREATE TABLE IF NOT EXISTS memory.default.test (
        field1 INTEGER,
        field2 INTEGER
      )

  - id: insert_1
    type: io.kestra.plugin.jdbc.trino.Query
    username: "{{ vars.trino_user }}"
    url: "jdbc:trino://localhost:{{ outputs.port.value }}"
    fetchType: NONE
    sql: |
      INSERT INTO memory.default.test VALUES (1, 2)

  - id: insert_2
    type: io.kestra.plugin.jdbc.trino.Query
    username: "{{ vars.trino_user }}"
    url: "jdbc:trino://localhost:{{ outputs.port.value }}"
    fetchType: NONE
    sql: |
      INSERT INTO memory.default.test VALUES (3, 4)

  - id: query
    type: io.kestra.plugin.jdbc.trino.Query
    username: "{{ vars.trino_user }}"
    url: "jdbc:trino://localhost:{{ outputs.port.value }}"
    fetchType: FETCH
    sql: |
      SELECT * FROM memory.default.test ORDER BY field1

  - id: assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - '{{ outputs.query["rows"]["0"]["field1"] == 1 }}'
      - '{{ outputs.query["rows"]["0"]["field2"] == 2 }}'
      - '{{ outputs.query["rows"]["1"]["field1"] == 3 }}'

finally:
  - id: dockerStop
    type: io.kestra.plugin.docker.Stop
    containerId: "{{ outputs.dockerStart.taskRunner.containerId }}"
    kill: true

  - id: purge
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
